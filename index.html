  <!-- 메인 프레임 (화면 중앙 고정 및 상하좌우 레터박스) -->
  <div class="scene-container">

    <!-- SCENE 1 (거리 줌인) -->
    <div class="scene-section scene-1 active" id="scene1">
      <div class="camera-rig">
        <div class="layer background-layer">
          <img src="images/0_background.png" alt="거리 배경" class="scene-img">
        </div>
        <div class="layer front-layer">
          <img src="images/0_front.png" alt="거리 전경" class="scene-img">
        </div>
      </div>
    </div>

    <!-- SCENE 2 (가게 내부) -->
    <div class="scene-section scene-2" id="scene2">
      <!-- 1. 뒤 배경 -->
      <div class="layer inside-bg-layer">
        <img src="images/1_background.png" alt="가게 내부 배경" class="inside-img">
      </div>

      <!-- 2. 직원 (아래에서 뿅!) -->
      <div class="layer staff-layer">
        <img id="staffImg" src="images/1_h_stand.png" alt="직원" class="staff-img">
      </div>

      <!-- 3. 앞 계산대 -->
      <div class="layer inside-front-layer">
        <img src="images/1_front.png" alt="계산대 전경" class="inside-img">
      </div>

      <!-- 4. 말풍선 및 선택지 버튼 UI -->
      <div class="ui-layer">
        <!-- 말풍선 + 선택지 (말풍선이 길어지면 버튼도 같이 내려감) -->
        <div class="dialog-stack">
          <div class="speech-bubble" id="speechBubble">
            <!-- 말풍선 모양(꼬리 포함)은 images/ui/bubble.svg -->
            <div class="bubble-shape"></div>
            <p class="dialogue-text" id="dialogueText"></p>
          </div>
        </div>

        <!-- 선택지 버튼 (하단 중앙, script.js 가 자동으로 만들어요) -->
        <div class="choice-container" id="choiceContainer"></div>
      </div>
    </div>

    <!-- SCENE 3 (영수증 확인 → 결제) -->
    <div class="scene-section scene-3" id="scene3">
      <!-- 1. 배경 (계산대 앞 레이어 없음) -->
      <div class="layer inside-bg-layer">
        <img src="images/2_background.png" alt="가게 내부 배경" class="inside-img">
      </div>

      <!-- 2. 추천된 강아지 (견종에 맞게 script.js 가 이미지와 위치를 넣어요) -->
      <img class="s3-dog" id="s3Dog" alt="추천 견종">

      <!-- 3. 직원 (결제 시 아래에서 튀어나옴) -->
      <div class="s3-staff-layer">
        <img id="s3Staff" src="images/1_h_stand.png" alt="직원" class="staff-img">
      </div>

      <!-- 4. 카드를 든 손 (아래에서 위로 스윽) -->
      <img class="s3-hand" id="s3Hand" src="images/2_hand.png" alt="">

      <!-- 5. 영수증 (내용은 script.js 가 견종에 맞게 채워요) -->
      <div class="receipt" id="receipt">
        <div class="receipt-bg"></div>
        <img class="receipt-watermark" src="images/3_receipt_logo.png" alt="">
        <div class="receipt-scroll" id="receiptScroll">
          <div class="r-content" id="receiptContent"></div>
        </div>
        <img class="receipt-frame" src="images/ui/receipt_frame.png" alt="">
      </div>
    </div>

    <!-- 장면 전환 페이드 막 -->
    <div class="fade-overlay" id="fadeOverlay"></div>

  </div>

  <script src="script.js"></script>
</body>

</html>
